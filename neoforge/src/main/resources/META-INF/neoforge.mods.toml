modLoader = "klf"
loaderVersion = "[${versions.kotlin_neoforge_range},)"
issueTrackerURL = "${mod_issues}"
license = "${mod_license}"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}-common.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_display_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''
logoFile = "assets/${mod_id}/banner.png"
displayURL = "${mod_url}"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${versions.neoforge_range},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "[${versions.minecraft}]"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "archie"
type = "required"
versionRange = "[${versions.archie},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "cloth_config"
type = "required"
versionRange = "[${versions.cloth_config_range},)"
ordering = "NONE"
side = "BOTH"

# Every block entity this mod draws is rendered through Flywheel and has no vanilla
# BlockEntityRenderer fallback, so the mod is not merely better with it - it is blank without it.
[[dependencies."${mod_id}"]]
modId = "flywheel"
type = "required"
versionRange = "[${versions.flywheel_range},)"
ordering = "NONE"
side = "CLIENT"

[modproperties."${mod_id}"]
catalogueImageIcon = "assets/${mod_id}/icon.png"
