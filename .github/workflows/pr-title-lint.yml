name: PR title lint

# Enforces Conventional Commits (https://www.conventionalcommits.org/) on PR titles.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          requireScope: false
          # Squash-merged PRs commonly get "(#123)" appended by GitHub - allow trailing
          # whitespace/punctuation around that without rejecting an otherwise-valid title.
          subjectPattern: ^(?!\s*$).+$
